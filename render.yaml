# Render Blueprint for the backend API (the frontend is deployed on Vercel).
# Render: New > Blueprint > pick this repository. See README "Deployment".
services:
  - type: web
    name: route53-clone-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Free instance: no persistent disk, so the SQLite file lives in the container and is
    # reset to the demo seed whenever the service restarts or redeploys. To keep data, switch
    # to `plan: starter` and add:
    #   disk:
    #     name: route53-data
    #     mountPath: /var/data
    #     sizeGB: 1
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/route53.db
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_TTL_HOURS
        value: "12"
      # The Vercel URL of the frontend, e.g. https://your-app.vercel.app (set after the
      # first Vercel deploy). Only needed for direct browser calls such as /docs.
      - key: FRONTEND_ORIGIN
        sync: false
